<!DOCTYPE html>
<html>
<head>
    <title>Resultados</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">

<div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-lg">
    <h1 class="text-3xl font-bold text-center mb-6 text-white">Resultados de la Encuesta</h1>

    <div id="results" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
</div>

<script>
    async function loadResults() {
        const res = await fetch("/api/full-results");
        const data = await res.json();

        let html = "";

        data.forEach(q => {
            const total = q.votes.reduce((a,b)=>a+b, 0);

            const optionsHtml = q.options.map((opt, i) => {
                const percent = total > 0 ? Math.round((q.votes[i] / total) * 100) : 0;

                return `
                    <div class="bg-gray-700 p-4 rounded-xl shadow-md mb-3">
                        <div class="flex justify-between mb-2">
                            <span class="font-semibold">${opt}</span>
                            <span>${q.votes[i]} votos (${percent}%)</span>
                        </div>
                        <div class="w-full bg-gray-600 rounded-full h-3">
                            <div class="bg-indigo-400 h-3 rounded-full" style="width:${percent}%"></div>
                        </div>
                    </div>
                `;
            }).join("");

            html += `
                <div class="bg-gray-800 p-4 rounded-xl shadow-xl">
                    <h2 class="text-lg font-bold text-white mb-2">${q.text}</h2>
                    ${optionsHtml}
                </div>
            `;
        });

        document.getElementById("results").innerHTML = html;
    }

    setInterval(loadResults, 1000);
    loadResults();
</script>

</body>
</html>
