<!DOCTYPE html>
<html>
<head>
    <title>Votación</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-purple-700 flex items-center justify-center h-screen text-white">

<div id="app" class="bg-white text-black p-8 rounded-2xl shadow-xl w-96">

    <h1 id="question-title" class="text-2xl font-bold text-center mb-6"></h1>

    <div id="options" class="space-y-3"></div>

    <p id="msg" class="text-center mt-4 font-medium"></p>

</div>

<script>
    let currentQuestion = 1;
    let questions = [];

    async function loadQuestions() {
        const res = await fetch("/api/questions");
        questions = await res.json();
        showQuestion();
    }

    function showQuestion() {
        const q = questions.find(q => q.id === currentQuestion);
        if (!q) {
            document.getElementById("app").innerHTML = "<h2 class='text-xl font-bold text-center'>Gracias por votar!</h2>";
            return;
        }

        document.getElementById("question-title").textContent = q.text;

        const optionsContainer = document.getElementById("options");
        optionsContainer.innerHTML = "";

        q.options.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.textContent = opt;
            btn.className = "w-full p-3 rounded-xl bg-purple-500 hover:bg-purple-600 text-white font-bold";
            btn.onclick = () => vote(idx);
            optionsContainer.appendChild(btn);
        });
    }

    async function vote(option) {
        await fetch("/api/vote", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ questionId: currentQuestion, option })
        });

        document.getElementById("msg").textContent = "Voto enviado";

        setTimeout(() => {
            currentQuestion++;
            document.getElementById("msg").textContent = "";
            showQuestion();
        }, 800);
    }

    loadQuestions();
</script>

</body>
</html>
